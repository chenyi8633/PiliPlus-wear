              sub(p, "  @override\n  Widget build(BuildContext context) {\n    if (Platform.isLinux) {\n      return _buildLinuxView(context);\n    }\n",
          r"""  List<Map<String, Object?>> _geckoCookies() {
              if (!LinuxCookieManager.isBiliDomain(_currentUrl)) return const [];
              return LinuxCookieManager.getCookies().map((c) {
                return <String, Object?>{
                  'name': c.name,
                  'value': c.value,
                  'domain': c.domain ?? 'bilibili.com',
                  'path': c.path ?? '/',
                  'secure': c.secure,
                  'httpOnly': c.httpOnly,
                };
              }).toList();
            }

            Future<void> _handleGeckoMenu(WebviewMenuItem item) async {
              final ctr = _geckoController;
              switch (item) {
                case WebviewMenuItem.refresh:
                  ctr?.reload();
                  break;
                case WebviewMenuItem.copy:
                  Utils.copyText(ctr?.currentUrl ?? _currentUrl);
                  break;
                case WebviewMenuItem.openInBrowser:
                  PageUtils.launchURL(ctr?.currentUrl ?? _currentUrl);
                  break;
                case WebviewMenuItem.clearCache:
                  await ctr?.clearCache();
                  SmartDialog.showToast('已清理');
                  break;
                case WebviewMenuItem.goBack:
                  if (ctr != null && await ctr.canGoBack()) {
                    ctr.goBack();
                  } else {
                    Get.back();
                  }
                  break;
                case WebviewMenuItem.resetCookie:
                  await ctr?.setCookies(_geckoCookies());
                  SmartDialog.showToast('设置成功，正在刷新网页');
                  break;
              }
            }

            Future<bool> _geckoNavigationRequest(String u, String initUrl) async {
              if (u == initUrl) return true;
              final uri = Uri.tryParse(u);
              if (!_inApp && uri != null) {
                final hasMatch = await PiliScheme.routePush(
                  uri,
                  selfHandle: true,
                  off: _off,
                );
                if (hasMatch) {
                  _progress.value = 1;
                  return false;
                }
              }
              if (_prefixRegex.hasMatch(u)) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(
                      persist: false,
                      showCloseIcon: true,
                      content: const Text('当前网页将要打开外部链接，是否打开'),
                      action: SnackBarAction(
                        label: '打开',
                        onPressed: () => PageUtils.launchURL(u),
                      ),
                    ),
                  );
                }
                _progress.value = 1;
                return false;
              }
              return true;
            }

            void _geckoDownload(String url) {
              if (!mounted) return;
              showDialog(
                context: context,
                builder: (context) => AlertDialog(
                  title: const Text('下载文件 ?', style: TextStyle(fontSize: 18)),
                  content: SelectionText(url),
                  actions: [
                    TextButton(
                      onPressed: Get.back,
                      child: Text(
                        '取消',
                        style: TextStyle(color: Theme.of(context).colorScheme.outline),
                      ),
                    ),
                    TextButton(
                      onPressed: () {
                        Get.back();
                        PageUtils.launchURL(url);
                      },
                      child: const Text('确定'),
                    ),
                  ],
                ),
              );
              _progress.value = 1;
            }

            void _geckoMessage(String msg) {
              if (msg == 'finishButtonClicked') {
                if (mounted) Get.back();
              } else if (msg == 'infoBarClicked') {
                final uri = Uri.tryParse(_geckoController?.currentUrl ?? _currentUrl);
                final targetOid = uri?.queryParameters['oid'] ?? widget.oid?.toString();
                if (targetOid != null) {
                  PiliScheme.videoPush(int.parse(targetOid), null);
                }
              }
            }

            Widget _buildGeckoView(BuildContext context) {
              final initUrl = _currentUrl;
              return Scaffold(
                appBar: widget.url != null
                    ? null
                    : AppBar(
                        title: Obx(
                          () => Text(
                            _title.value.isNotEmpty ? _title.value : _currentUrl,
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                          ),
                        ),
                        bottom: PreferredSize(
                          preferredSize: Size.zero,
                          child: Obx(
                            () => _progress.value < 1
                                ? LinearProgressIndicator(value: _progress.value)
                                : const SizedBox.shrink(),
                          ),
                        ),
                        actions: _isPop ? null : _actions,
                      ),
                body: _isPop
                    ? null
                    : SafeArea(
                        child: GeckoWebview(
                          initialUrl: initUrl,
                          userAgent: userAgent,
                          cookies: _geckoCookies(),
                          onWebViewCreated: (ctr) => _geckoController = ctr,
                          onUrlChanged: (u) {
                            _currentUrl = u;
                            if (_title.value.isEmpty || _title.value == _currentUrl) {
                              _title.value = u;
                            }
                          },
                          onTitleChanged: (t) {
                            if (t.isNotEmpty) _title.value = t;
                          },
                          onProgress: (p) => _progress.value = p,
                          onWebMessageReceived: _geckoMessage,
                          onNavigationRequest: (u) => _geckoNavigationRequest(u, initUrl),
                          onDownload: _geckoDownload,
                          onCloseWindow: () {
                            if (mounted) Get.back();
                          },
