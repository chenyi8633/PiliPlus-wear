name: Build Wear OS armv7 APK (GeckoView)

# 用法:把整个文件内容粘贴到仓库的 .github/workflows/wear-armv7.yml
# 然后到 Actions 页面选 "Build Wear OS armv7 APK" -> Run workflow
# 它会先自动给源码打上"手表圆屏适配 + 启动防崩溃"补丁,再编译 32 位(armeabi-v7a) APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wear-armv7.yml'

jobs:
  android-armv7:
    name: Wear OS armv7
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 代码迁出
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 构建Java环境
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: 安装Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: 应用手表适配补丁
        shell: bash
        run: |
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          """PiliPlus -> Wear OS (round screen, armv7) source patcher. Idempotent; fails loudly if an anchor is missing."""
          import os, sys

          def read(p):
              with open(p, encoding='utf-8') as f:
                  return f.read()

          def write(p, s):
              with open(p, 'w', encoding='utf-8', newline='\n') as f:
                  f.write(s)

          def sub(path, old, new, count=1):
              s = read(path)
              if s.count(old) != count:
                  sys.exit(f'[wear_patch] anchor not found/unique in {path}: {old[:60]!r} (found {s.count(old)})')
              write(path, s.replace(old, new))

          IMPORT = "import 'package:PiliPlus/utils/wear_utils.dart';\n"

          # ---------- 1. new file: wear_utils.dart ----------
          WEAR_UTILS = r'''import 'dart:io' show Platform;
          import 'dart:ui' show PlatformDispatcher;

          import 'package:flutter/widgets.dart';

          /// Wear OS / 圆形小屏适配。
          /// 逻辑宽度小于 300dp 时判定为手表,并把界面缩放到约 320dp 宽(手机最小布局宽度),
          /// 这样原有所有页面和功能都能正常排布,不需要删减。
          abstract final class WearUtils {
            static bool isWatch = false;
            static double defaultUiScale = 1.0;
            static const double _targetWidth = 320.0;

            static void init() {
              try {
                if (!Platform.isAndroid) return;
                final views = PlatformDispatcher.instance.views;
                if (views.isEmpty) return;
                final view = views.first;
                final shortest = view.physicalSize.shortestSide / view.devicePixelRatio;
                if (shortest > 0 && shortest < 300) {
                  isWatch = true;
                  defaultUiScale = shortest / _targetWidth;
                }
              } catch (_) {}
            }
          }

          /// 给圆屏四周留出安全边距,避免内容被圆角裁切。
          class WearFrame extends StatelessWidget {
            const WearFrame({super.key, required this.child});

            final Widget child;

            @override
            Widget build(BuildContext context) {
              final mq = MediaQuery.of(context);
              final size = mq.size;
              final extra = EdgeInsets.symmetric(
                horizontal: size.width * 0.05,
                vertical: size.height * 0.09,
              );
              return MediaQuery(
                data: mq.copyWith(
                  padding: mq.padding + extra,
                  viewPadding: mq.viewPadding + extra,
                ),
                child: child,
              );
            }
          }
          '''
          write('lib/utils/wear_utils.dart', WEAR_UTILS)

          # ---------- 2. storage_pref.dart: default uiScale on watch ----------
          p = 'lib/utils/storage_pref.dart'
          if 'WearUtils' not in read(p):
              sub(p, "_setting.get(SettingBoxKey.uiScale, defaultValue: 1.0);",
                     "_setting.get(SettingBoxKey.uiScale, defaultValue: WearUtils.defaultUiScale);")
              write(p, IMPORT + read(p))

          # ---------- 3. main.dart ----------
          p = 'lib/main.dart'
          if 'WearUtils' not in read(p):
              sub(p, "  ScaledWidgetsFlutterBinding.ensureInitialized();\n",
                     "  ScaledWidgetsFlutterBinding.ensureInitialized();\n  WearUtils.init();\n")
              sub(p, """  try {
              await GStorage.init();
            } catch (e) {
              await Utils.copyText(e.toString(), needToast: false);
              if (kDebugMode) debugPrint('GStorage init error: $e');
              DeviceUtils.exitApp();
            }
          """, "  await _initStorage();\n")
              sub(p, "Future<void> _initDownPath() async {", r"""/// 存储初始化失败(残留锁文件/数据损坏)时自动自救,而不是直接退出导致"再也打不开"。
          Future<void> _initStorage() async {
            try {
              await GStorage.init();
              return;
            } catch (e) {
              if (kDebugMode) debugPrint('GStorage init error: $e');
            }
            final hiveDir = Directory(path.join(appSupportDirPath, 'hive'));
            // 第一步:清理残留锁文件后重试
            try {
              await Hive.close();
              if (hiveDir.existsSync()) {
                for (final f in hiveDir.listSync()) {
                  if (f is File && f.path.endsWith('.lock')) f.deleteSync();
                }
              }
              await GStorage.init();
              return;
            } catch (e) {
              if (kDebugMode) debugPrint('GStorage retry error: $e');
            }
            // 第二步:把损坏的数据目录改名备份,重新建库
            try {
              await Hive.close();
              if (hiveDir.existsSync()) {
                hiveDir.renameSync(
                  '${hiveDir.path}_corrupt_${DateTime.now().millisecondsSinceEpoch}',
                );
              }
              await GStorage.init();
              return;
            } catch (e) {
              await Utils.copyText(e.toString(), needToast: false);
              if (kDebugMode) debugPrint('GStorage rebuild error: $e');
              DeviceUtils.exitApp();
            }
          }

          Future<void> _initDownPath() async {""")
              sub(p, "    if (PlatformUtils.isDesktop) {\n      return BackDetector(",
                     "    if (WearUtils.isWatch) {\n      child = WearFrame(child: child);\n    }\n    if (PlatformUtils.isDesktop) {\n      return BackDetector(")
              sub(p, "import 'package:flutter_smart_dialog/flutter_smart_dialog.dart';\n",
                     "import 'package:flutter_smart_dialog/flutter_smart_dialog.dart';\nimport 'package:hive_ce/hive.dart' show Hive;\n")
              write(p, IMPORT + read(p))

          # ---------- 4. login_utils.dart: WebView 缺失时不崩溃 ----------
          p = 'lib/utils/login_utils.dart'
          if '_setWebCookie' not in read(p):
              sub(p, "  static FutureOr setWebCookie([Account? account]) {",
          """  /// 手表等没有系统 WebView 的设备上,同步 Cookie 失败不应导致应用崩溃/无法启动。
            static Future<void> setWebCookie([Account? account]) async {
              try {
                await _setWebCookie(account);
              } catch (_) {}
            }

            static FutureOr _setWebCookie([Account? account]) {""")

          # ---------- 5. AndroidManifest: Wear OS 声明 ----------
          p = 'android/app/src/main/AndroidManifest.xml'
          if 'android.hardware.type.watch' not in read(p):
              sub(p, '    <application xmlns:tools="http://schemas.android.com/tools"',
                     '    <uses-feature android:name="android.hardware.type.watch" />\n\n    <application xmlns:tools="http://schemas.android.com/tools"')
              sub(p, '        <meta-data\n            android:name="io.flutter.embedding.android.EnableImpeller"',
                     '        <uses-library\n            android:name="com.google.android.wearable"\n            android:required="false" />\n        <meta-data\n            android:name="com.google.android.wearable.standalone"\n            android:value="true" />\n        <meta-data\n            android:name="io.flutter.embedding.android.EnableImpeller"')

          # =====================================================================
          # 6. GeckoView(内置 32 位网页引擎) —— 替代系统 WebView,手表没有 WebView 也能打开网页
          # =====================================================================
          def put(path, text):
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              write(path, text)

          def resolve_gecko_version():
              forced = os.environ.get('GECKO_VERSION')
              if forced:
                  return forced
              import re, urllib.request
              url = 'https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-armeabi-v7a/maven-metadata.xml'
              try:
                  xml = urllib.request.urlopen(url, timeout=60).read().decode('utf-8', 'replace')
              except Exception as e:
                  sys.exit(f'[wear_patch] 无法读取 GeckoView 版本列表 {url}: {e}')
              vers = re.findall(r'<version>([^<]+)</version>', xml)
              def key(v):
                  try:
                      return tuple(int(x) for x in v.split('.'))
                  except ValueError:
                      return (-1,)
              major = os.environ.get('GECKO_MAJOR')
              if major:
                  vers = [v for v in vers if v.split('.')[0] == major]
              vers = [v for v in vers if key(v) != (-1,)]
              if not vers:
                  sys.exit('[wear_patch] 版本列表里没有可用的 GeckoView 版本')
              best = max(vers, key=key)
              print('[wear_patch] GeckoView version =', best)
              return best

          GECKO_VIEW_TYPE = 'com.example.piliplus/gecko_view'
          KT_DIR = 'android/app/src/main/kotlin/com/example/piliplus'
          EXT_DIR = 'android/app/src/main/assets/geckoext'

          # ---- 6.1 Gradle ----
          p = 'android/build.gradle.kts'
          if 'maven.mozilla.org' not in read(p):
              sub(p, "        google()\n        mavenCentral()\n    }\n}\n",
                     "        google()\n        mavenCentral()\n        maven { url = uri(\"https://maven.mozilla.org/maven2/\") }\n    }\n}\n")

          p = 'android/app/build.gradle.kts'
          if 'org.mozilla.geckoview' not in read(p):
              gv = resolve_gecko_version()
              sub(p, 'flutter {\n    source = "../.."\n}',
                     'flutter {\n    source = "../.."\n}\n\ndependencies {\n    implementation("org.mozilla.geckoview:geckoview-armeabi-v7a:' + gv + '")\n}')

          # ---- 6.2 内置 WebExtension (用来给 B 站网页注入 Cookie、处理笔记页/直播页) ----
          put(EXT_DIR + '/manifest.json', r"""{
            "manifest_version": 2,
            "name": "PiliPlus Helper",
            "version": "1.0",
            "browser_specific_settings": { "gecko": { "id": "pili@piliplus.app" } },
            "permissions": [
              "nativeMessaging",
              "geckoViewAddons",
              "cookies",
              "*://*.bilibili.com/*"
            ],
            "background": { "scripts": ["background.js"] },
            "content_scripts": [
              {
                "matches": ["*://*.bilibili.com/*"],
                "js": ["content.js"],
                "run_at": "document_start",
                "all_frames": true
              }
            ]
          }
          """)

          put(EXT_DIR + '/background.js', r"""var port = null;

          function connect() {
            try {
              port = browser.runtime.connectNative("browser");
              port.onMessage.addListener(onNative);
              port.onDisconnect.addListener(function () {
                port = null;
                setTimeout(connect, 1000);
              });
            } catch (e) {
              port = null;
              setTimeout(connect, 1000);
            }
          }

          async function onNative(msg) {
            if (!msg || msg.type !== "cookies") return;
            var ok = 0;
            var list = msg.cookies || [];
            for (var i = 0; i < list.length; i++) {
              var c = list[i];
              try {
                var host = String(c.domain || "bilibili.com").replace(/^\./, "");
                await browser.cookies.set({
                  url: "https://" + host + (c.path || "/"),
                  name: c.name,
                  value: c.value,
                  domain: "." + host,
                  path: c.path || "/",
                  secure: !!c.secure,
                  httpOnly: !!c.httpOnly,
                  expirationDate: Math.floor(Date.now() / 1000) + 31536000
                });
                ok++;
              } catch (e) {}
            }
            try {
              if (port) port.postMessage({ type: "cookiesSet", ok: ok });
            } catch (e) {}
          }

          connect();
          """)

          put(EXT_DIR + '/content.js', r"""(function () {
            var href = location.href;

            function send(m) {
              try {
                location.href = "pilimsg://m/" + encodeURIComponent(m);
              } catch (e) {}
            }

            if (href.indexOf("https://www.bilibili.com/h5/note-app") === 0) {
              document.addEventListener("click", function (e) {
                var t = e.target;
                var finish = t && t.closest ? t.closest(".finish-btn") : null;
                if (finish) { send("finishButtonClicked"); return; }
                var info = t && t.closest ? t.closest(".info-bar") : null;
                if (info) { send("infoBarClicked"); }
              }, true);
            }

            if (href.indexOf("https://live.bilibili.com") === 0) {
              var inject = function () {
                if (document.getElementById("pili-live-style")) return;
                var s = document.createElement("style");
                s.id = "pili-live-style";
                s.textContent = "div.open-app-btn.bili-btn-warp {display:none !important;} #app__display-area > div.control-panel {display:none !important;}";
                (document.head || document.documentElement).appendChild(s);
              };
              if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", inject);
              } else {
                inject();
              }
            }
          })();
          """)

          # ---- 6.3 Kotlin ----
          put(KT_DIR + '/GeckoHolder.kt', r"""package com.example.piliplus

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.util.Log
          import org.json.JSONArray
          import org.json.JSONObject
          import org.mozilla.geckoview.GeckoRuntime
          import org.mozilla.geckoview.GeckoRuntimeSettings
          import org.mozilla.geckoview.WebExtension

          object GeckoHolder {
              private const val TAG = "PiliGecko"
              private var runtime: GeckoRuntime? = null
              private var port: WebExtension.Port? = null
              private var pendingDone: (() -> Unit)? = null
              private val handler = Handler(Looper.getMainLooper())

              private val portDelegate = object : WebExtension.PortDelegate {
                  override fun onPortMessage(message: Any, port: WebExtension.Port) {
                      val type = (message as? JSONObject)?.optString("type")
                      if (type == "cookiesSet") finishPending()
                  }

                  override fun onDisconnect(port: WebExtension.Port) {
                      if (this@GeckoHolder.port === port) this@GeckoHolder.port = null
                  }
              }

              private val messageDelegate = object : WebExtension.MessageDelegate {
                  override fun onConnect(port: WebExtension.Port) {
                      this@GeckoHolder.port = port
                      port.setDelegate(portDelegate)
                  }
              }

              fun runtime(context: Context): GeckoRuntime {
                  runtime?.let { return it }
                  val settings = GeckoRuntimeSettings.Builder()
                      .javaScriptEnabled(true)
                      .build()
                  val rt = GeckoRuntime.create(context.applicationContext, settings)
                  runtime = rt
                  try {
                      rt.webExtensionController
                          .ensureBuiltIn("resource://android/assets/geckoext/", "pili@piliplus.app")
                          .accept(
                              { ext -> ext?.setMessageDelegate(messageDelegate, "browser") },
                              { err -> Log.e(TAG, "install extension failed", err) }
                          )
                  } catch (e: Exception) {
                      Log.e(TAG, "install extension error", e)
                  }
                  return rt
              }

              private fun finishPending() {
                  val d = pendingDone
                  pendingDone = null
                  d?.invoke()
              }

              /** 把 App 里的登录 Cookie 写进 Gecko(含 HttpOnly),完成后回调 done。 */
              fun syncCookies(json: String, done: () -> Unit) {
                  val start = SystemClock.uptimeMillis()
                  fun attempt() {
                      val p = port
                      if (p == null) {
                          if (SystemClock.uptimeMillis() - start < 4000) {
                              handler.postDelayed({ attempt() }, 200)
                          } else {
                              done()
                          }
                          return
                      }
                      finishPending()
                      pendingDone = done
                      try {
                          p.postMessage(
                              JSONObject().put("type", "cookies").put("cookies", JSONArray(json))
                          )
                      } catch (e: Exception) {
                          Log.e(TAG, "post cookies failed", e)
                          finishPending()
                          return
                      }
                      handler.postDelayed({ finishPending() }, 2000)
                  }
                  attempt()
              }
          }
          """)

          put(KT_DIR + '/GeckoPlatformView.kt', r"""package com.example.piliplus

          import android.content.Context
          import android.net.Uri
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import io.flutter.plugin.common.BinaryMessenger
          import io.flutter.plugin.common.MethodCall
          import io.flutter.plugin.common.MethodChannel
          import io.flutter.plugin.common.StandardMessageCodec
          import io.flutter.plugin.platform.PlatformView
          import io.flutter.plugin.platform.PlatformViewFactory
          import org.mozilla.geckoview.AllowOrDeny
          import org.mozilla.geckoview.GeckoResult
          import org.mozilla.geckoview.GeckoSession
          import org.mozilla.geckoview.GeckoSessionSettings
          import org.mozilla.geckoview.GeckoView
          import org.mozilla.geckoview.StorageController
          import org.mozilla.geckoview.WebResponse

          class GeckoViewFactory(private val messenger: BinaryMessenger) :
              PlatformViewFactory(StandardMessageCodec.INSTANCE) {
              override fun create(context: Context?, viewId: Int, args: Any?): PlatformView {
                  return GeckoPlatformView(context!!, viewId, messenger, args as? Map<*, *>)
              }
          }

          class GeckoPlatformView(
              private val context: Context,
              id: Int,
              messenger: BinaryMessenger,
              params: Map<*, *>?,
          ) : PlatformView, MethodChannel.MethodCallHandler {

              private val channel = MethodChannel(messenger, "com.example.piliplus/gecko_$id")
              private val geckoView = GeckoView(context)
              private val session: GeckoSession
              private val handler = Handler(Looper.getMainLooper())
              private var disposed = false
              private var canBack = false

              init {
                  channel.setMethodCallHandler(this)

                  val ua = params?.get("userAgent") as? String
                  val incognito = (params?.get("incognito") as? Boolean) ?: false
                  val builder = GeckoSessionSettings.Builder().usePrivateMode(incognito)
                  if (!ua.isNullOrEmpty()) builder.userAgentOverride(ua)
                  session = GeckoSession(builder.build())

                  session.progressDelegate = object : GeckoSession.ProgressDelegate {
                      override fun onPageStart(session: GeckoSession, url: String) {
                          channel.invokeMethod("onUrlChanged", mapOf("url" to url))
                      }

                      override fun onPageStop(session: GeckoSession, success: Boolean) {
                          channel.invokeMethod("onProgress", mapOf("progress" to 1.0))
                      }

                      override fun onProgressChange(session: GeckoSession, progress: Int) {
                          channel.invokeMethod("onProgress", mapOf("progress" to progress / 100.0))
                      }
                  }

                  session.contentDelegate = object : GeckoSession.ContentDelegate {
                      override fun onTitleChange(session: GeckoSession, title: String?) {
                          channel.invokeMethod("onTitleChanged", mapOf("title" to (title ?: "")))
                      }

                      override fun onCloseRequest(session: GeckoSession) {
                          channel.invokeMethod("onCloseWindow", null)
                      }

                      override fun onExternalResponse(session: GeckoSession, response: WebResponse) {
                          channel.invokeMethod("onDownload", mapOf("url" to response.uri))
                      }
                  }

                  session.navigationDelegate = object : GeckoSession.NavigationDelegate {
                      override fun onCanGoBack(session: GeckoSession, canGoBack: Boolean) {
                          canBack = canGoBack
                      }

                      override fun onNewSession(session: GeckoSession, uri: String): GeckoResult<GeckoSession>? {
                          channel.invokeMethod("onNewWindow", mapOf("url" to uri))
                          return null
                      }

                      override fun onLoadRequest(
                          session: GeckoSession,
                          request: GeckoSession.NavigationDelegate.LoadRequest,
                      ): GeckoResult<AllowOrDeny>? {
                          val uri = request.uri
                          if (uri.startsWith("pilimsg://")) {
                              val msg = try {
                                  Uri.decode(uri.substringAfter("pilimsg://m/"))
                              } catch (e: Exception) {
                                  ""
                              }
                              channel.invokeMethod("onWebMessageReceived", mapOf("message" to msg))
                              return GeckoResult.fromValue(AllowOrDeny.DENY)
                          }
                          if (uri.startsWith("data:") || uri.startsWith("about:") || uri.startsWith("blob:")) {
                              return GeckoResult.fromValue(AllowOrDeny.ALLOW)
                          }
                          val result = GeckoResult<AllowOrDeny>()
                          var done = false
                          fun finish(allow: Boolean) {
                              if (done) return
                              done = true
                              result.complete(if (allow) AllowOrDeny.ALLOW else AllowOrDeny.DENY)
                          }
                          handler.postDelayed({ finish(true) }, 5000)
                          channel.invokeMethod(
                              "onNavigationRequest",
                              mapOf("url" to uri),
                              object : MethodChannel.Result {
                                  override fun success(r: Any?) {
                                      finish(r != false)
                                  }

                                  override fun error(code: String, message: String?, details: Any?) {
                                      finish(true)
                                  }

                                  override fun notImplemented() {
                                      finish(true)
                                  }
                              }
                          )
                          return result
                      }
                  }

                  val runtime = GeckoHolder.runtime(context)
                  session.open(runtime)
                  geckoView.setSession(session)

                  val url = params?.get("initialUrl") as? String
                  val html = params?.get("initialHtml") as? String
                  val cookies = params?.get("cookies") as? String
                  val start = {
                      if (!disposed) {
                          if (html != null) {
                              session.load(GeckoSession.Loader().data(html, "text/html"))
                          } else if (url != null) {
                              session.loadUri(url)
                          }
                      }
                  }
                  if (!cookies.isNullOrEmpty()) {
                      GeckoHolder.syncCookies(cookies) { start() }
                  } else {
                      start()
                  }
              }

              override fun getView(): View = geckoView

              override fun onMethodCall(call: MethodCall, result: MethodChannel.Result) {
                  if (disposed) {
                      result.success(null)
                      return
                  }
                  when (call.method) {
                      "loadUrl" -> {
                          session.loadUri(call.argument<String>("url") ?: "about:blank")
                          result.success(null)
                      }
                      "reload" -> {
                          session.reload()
                          result.success(null)
                      }
                      "goBack" -> {
                          session.goBack()
                          result.success(null)
                      }
                      "canGoBack" -> result.success(canBack)
                      "clearCache" -> {
                          GeckoHolder.runtime(context).storageController.clearData(
                              StorageController.ClearFlags.NETWORK_CACHE or StorageController.ClearFlags.IMAGE_CACHE
                          )
                          result.success(null)
                      }
                      "setCookies" -> {
                          val json = call.argument<String>("cookies") ?: "[]"
                          GeckoHolder.syncCookies(json) {
                              if (!disposed) session.reload()
                          }
                          result.success(null)
                      }
                      else -> result.notImplemented()
                  }
              }

              override fun dispose() {
                  if (disposed) return
                  disposed = true
                  channel.setMethodCallHandler(null)
                  try {
                      geckoView.releaseSession()
                      session.close()
                  } catch (e: Exception) {
                  }
              }
          }
          """)

          p = KT_DIR + '/MainActivity.kt'
          if 'GeckoViewFactory' not in read(p):
              sub(p, "import com.ryanheise.audioservice.AudioServiceActivity\n",
                     "import com.ryanheise.audioservice.AudioServiceActivity\nimport io.flutter.embedding.engine.FlutterEngine\n")
              sub(p, "class MainActivity : AudioServiceActivity() {\n",
          """class MainActivity : AudioServiceActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  flutterEngine.platformViewsController.registry.registerViewFactory(
                      "com.example.piliplus/gecko_view",
                      GeckoViewFactory(flutterEngine.dartExecutor.binaryMessenger)
                  )
              }

          """)

          # ---- 6.4 Dart: gecko_webview.dart ----
          put('lib/plugin/gecko_webview.dart', r"""import 'dart:async';
          import 'dart:convert' show jsonEncode;

          import 'package:flutter/foundation.dart' show Factory, debugPrint;
          import 'package:flutter/gestures.dart';
          import 'package:flutter/rendering.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter/widgets.dart';

          const String _viewType = 'com.example.piliplus/gecko_view';

          /// 内置 GeckoView(Mozilla 网页引擎) 的控制器,接口和 LinuxWebviewController 类似。
          class GeckoWebviewController {
            GeckoWebviewController._(this.viewId)
              : _channel = MethodChannel('com.example.piliplus/gecko_$viewId');

            final int viewId;
            final MethodChannel _channel;
            String? currentUrl;

            Future<void> _call(String method, [Object? args]) async {
              try {
                await _channel.invokeMethod<void>(method, args);
              } catch (e) {
                debugPrint('GeckoWebview.$method error: $e');
              }
            }

            Future<void> loadUrl(String url) => _call('loadUrl', {'url': url});

            Future<void> reload() => _call('reload');

            Future<void> goBack() => _call('goBack');

            Future<void> clearCache() => _call('clearCache');

            Future<void> setCookies(List<Map<String, Object?>> cookies) =>
                _call('setCookies', {'cookies': jsonEncode(cookies)});

            Future<bool> canGoBack() async {
              try {
                return await _channel.invokeMethod<bool>('canGoBack') ?? false;
              } catch (_) {
                return false;
              }
            }
          }

          class GeckoWebview extends StatefulWidget {
            const GeckoWebview({
              super.key,
              this.initialUrl,
              this.initialHtml,
              this.userAgent,
              this.incognito = false,
              this.cookies,
              this.onWebViewCreated,
              this.onUrlChanged,
              this.onTitleChanged,
              this.onProgress,
              this.onWebMessageReceived,
              this.onNavigationRequest,
              this.onDownload,
              this.onCloseWindow,
            });

            final String? initialUrl;
            final String? initialHtml;
            final String? userAgent;
            final bool incognito;

            /// 要写入引擎的 Cookie(name/value/domain/path/secure/httpOnly)
            final List<Map<String, Object?>>? cookies;

            final ValueChanged<GeckoWebviewController>? onWebViewCreated;
            final ValueChanged<String>? onUrlChanged;
            final ValueChanged<String>? onTitleChanged;
            final ValueChanged<double>? onProgress;
            final ValueChanged<String>? onWebMessageReceived;

            /// 返回 true 允许加载,false 取消加载
            final Future<bool> Function(String url)? onNavigationRequest;
            final ValueChanged<String>? onDownload;
            final VoidCallback? onCloseWindow;

            @override
            State<GeckoWebview> createState() => _GeckoWebviewState();
          }

          class _GeckoWebviewState extends State<GeckoWebview> {
            GeckoWebviewController? _ctr;

            @override
            void dispose() {
              _ctr?._channel.setMethodCallHandler(null);
              _ctr = null;
              super.dispose();
            }

            void _onCreated(int id) {
              final ctr = GeckoWebviewController._(id);
              ctr._channel.setMethodCallHandler(_handleCall);
              _ctr = ctr;
              widget.onWebViewCreated?.call(ctr);
            }

            Future<dynamic> _handleCall(MethodCall call) async {
              final args = call.arguments;
              final Map m = args is Map ? args : const {};
              switch (call.method) {
                case 'onUrlChanged':
                  final url = m['url'] as String? ?? '';
                  _ctr?.currentUrl = url;
                  widget.onUrlChanged?.call(url);
                  return null;
                case 'onProgress':
                  widget.onProgress?.call((m['progress'] as num?)?.toDouble() ?? 0.0);
                  return null;
                case 'onTitleChanged':
                  widget.onTitleChanged?.call(m['title'] as String? ?? '');
                  return null;
                case 'onWebMessageReceived':
                  widget.onWebMessageReceived?.call(m['message'] as String? ?? '');
                  return null;
                case 'onNavigationRequest':
                  final url = m['url'] as String? ?? '';
                  final cb = widget.onNavigationRequest;
                  if (cb == null) return true;
                  try {
                    return await cb(url);
                  } catch (_) {
                    return true;
                  }
                case 'onNewWindow':
                  final url = m['url'] as String? ?? '';
                  final cb = widget.onNavigationRequest;
                  var allow = true;
                  if (cb != null) {
                    try {
                      allow = await cb(url);
                    } catch (_) {}
                  }
                  if (allow) _ctr?.loadUrl(url);
                  return null;
                case 'onDownload':
                  widget.onDownload?.call(m['url'] as String? ?? '');
                  return null;
                case 'onCloseWindow':
                  widget.onCloseWindow?.call();
                  return null;
              }
              return null;
            }

            @override
            Widget build(BuildContext context) {
              final cookies = widget.cookies;
              final creationParams = <String, dynamic>{
                'initialUrl': widget.initialUrl,
                'initialHtml': widget.initialHtml,
                'userAgent': widget.userAgent,
                'incognito': widget.incognito,
                'cookies': (cookies == null || cookies.isEmpty)
                    ? null
                    : jsonEncode(cookies),
              };
              return PlatformViewLink(
                viewType: _viewType,
                surfaceFactory: (context, controller) {
                  return AndroidViewSurface(
                    controller: controller as AndroidViewController,
                    gestureRecognizers: <Factory<OneSequenceGestureRecognizer>>{
                      Factory<OneSequenceGestureRecognizer>(
                        () => EagerGestureRecognizer(),
                      ),
                    },
                    hitTestBehavior: PlatformViewHitTestBehavior.opaque,
                  );
                },
                onCreatePlatformView: (params) {
                  return PlatformViewsService.initExpensiveAndroidView(
                      id: params.id,
                      viewType: _viewType,
                      layoutDirection: TextDirection.ltr,
                      creationParams: creationParams,
                      creationParamsCodec: const StandardMessageCodec(),
                      onFocus: () => params.onFocusChanged(true),
                    )
                    ..addOnPlatformViewCreatedListener(params.onPlatformViewCreated)
                    ..addOnPlatformViewCreatedListener(_onCreated)
                    ..create();
                },
              );
            }
          }
          """)

          # ---- 6.5 Dart: 网页页面改用 Gecko ----
          GECKO_IMPORT = "import 'package:PiliPlus/plugin/gecko_webview.dart';\n"

